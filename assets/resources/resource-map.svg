<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Resource map for causal inference, machine learning, datasets, and learning paths</title>
  <desc id="desc">Six resource areas connect to an evidence-to-decision workflow: foundations, experimentation, Python ecosystem, machine learning and anomaly detection, datasets, and learning paths.</desc>
  <defs>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f7f4ed"/>
    </linearGradient>
    <linearGradient id="center" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#eff8f5"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-16%" width="120%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#25211d" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#176b63"/>
    </marker>
  </defs>

  <rect x="12" y="12" width="1176" height="336" rx="24" fill="url(#panel)" stroke="#ded7c8"/>
  <path d="M96 174 C245 118 365 116 475 156" fill="none" stroke="#176b63" stroke-width="3" stroke-opacity="0.38" marker-end="url(#arrow)"/>
  <path d="M590 112 C585 126 584 137 585 145" fill="none" stroke="#176b63" stroke-width="3" stroke-opacity="0.38" marker-end="url(#arrow)"/>
  <path d="M1104 174 C955 118 835 116 725 156" fill="none" stroke="#176b63" stroke-width="3" stroke-opacity="0.38" marker-end="url(#arrow)"/>
  <path d="M158 220 C292 260 391 247 482 207" fill="none" stroke="#b75d45" stroke-width="3" stroke-opacity="0.36" marker-end="url(#arrow)"/>
  <path d="M600 250 C596 238 594 225 594 215" fill="none" stroke="#b75d45" stroke-width="3" stroke-opacity="0.36" marker-end="url(#arrow)"/>
  <path d="M1040 220 C908 260 809 247 718 207" fill="none" stroke="#b75d45" stroke-width="3" stroke-opacity="0.36" marker-end="url(#arrow)"/>

  <g filter="url(#softShadow)">
    <rect x="450" y="145" width="300" height="70" rx="18" fill="url(#center)" stroke="#b7d9d3" stroke-width="1.5"/>
    <text x="600" y="176" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="800" fill="#25211d">Evidence-to-Decision</text>
    <text x="600" y="198" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" fill="#655f57">learning, implementation, audit</text>
  </g>

  <g font-family="Inter, Arial, sans-serif">
    <g>
      <rect x="60" y="58" width="250" height="82" rx="15" fill="#ffffff" stroke="#ded7c8"/>
      <circle cx="92" cy="99" r="15" fill="#e9f4f1" stroke="#176b63"/>
      <path d="M86 103 L92 91 L98 103 Z" fill="none" stroke="#176b63" stroke-width="2" stroke-linejoin="round"/>
      <text x="122" y="91" font-size="18" font-weight="800" fill="#25211d">Foundations</text>
      <text x="122" y="115" font-size="14" font-weight="600" fill="#655f57">books, theory, assumptions</text>
    </g>
    <g>
      <rect x="475" y="58" width="250" height="82" rx="15" fill="#ffffff" stroke="#ded7c8"/>
      <circle cx="507" cy="99" r="15" fill="#fff7e8" stroke="#c2912e"/>
      <path d="M499 99 H515 M507 91 V107" fill="none" stroke="#c2912e" stroke-width="2" stroke-linecap="round"/>
      <text x="537" y="91" font-size="18" font-weight="800" fill="#25211d">Experimentation</text>
      <text x="537" y="115" font-size="14" font-weight="600" fill="#655f57">tests, rollout, policy</text>
    </g>
    <g>
      <rect x="890" y="58" width="250" height="82" rx="15" fill="#ffffff" stroke="#ded7c8"/>
      <circle cx="922" cy="99" r="15" fill="#f0eef5" stroke="#5c4a72"/>
      <path d="M918 91 L910 99 L918 107 M926 91 L934 99 L926 107" fill="none" stroke="#5c4a72" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="952" y="91" font-size="18" font-weight="800" fill="#25211d">Python Ecosystem</text>
      <text x="952" y="115" font-size="14" font-weight="600" fill="#655f57">packages, estimation, refutation</text>
    </g>
    <g>
      <rect x="60" y="220" width="250" height="82" rx="15" fill="#ffffff" stroke="#ded7c8"/>
      <circle cx="92" cy="261" r="15" fill="#f7ece8" stroke="#b75d45"/>
      <path d="M82 264 C88 248 96 272 102 256" fill="none" stroke="#b75d45" stroke-width="2" stroke-linecap="round"/>
      <path d="M104 252 L108 248 L112 252" fill="none" stroke="#b75d45" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="122" y="253" font-size="18" font-weight="800" fill="#25211d">ML, XAI, Anomaly</text>
      <text x="122" y="277" font-size="14" font-weight="600" fill="#655f57">models, explanations, monitoring</text>
    </g>
    <g>
      <rect x="475" y="220" width="250" height="82" rx="15" fill="#ffffff" stroke="#ded7c8"/>
      <circle cx="507" cy="261" r="15" fill="#e9f4f1" stroke="#176b63"/>
      <ellipse cx="507" cy="255" rx="9" ry="4" fill="none" stroke="#176b63" stroke-width="2"/>
      <path d="M498 255 V266 C498 268 502 271 507 271 C512 271 516 268 516 266 V255" fill="none" stroke="#176b63" stroke-width="2"/>
      <text x="537" y="253" font-size="18" font-weight="800" fill="#25211d">Datasets</text>
      <text x="537" y="277" font-size="14" font-weight="600" fill="#655f57">benchmarks, logged data, cases</text>
    </g>
    <g>
      <rect x="890" y="220" width="250" height="82" rx="15" fill="#ffffff" stroke="#ded7c8"/>
      <circle cx="922" cy="261" r="15" fill="#fff7e8" stroke="#c2912e"/>
      <path d="M914 267 C920 255 927 268 932 255" fill="none" stroke="#c2912e" stroke-width="2" stroke-linecap="round"/>
      <circle cx="914" cy="267" r="2.5" fill="#c2912e"/>
      <circle cx="932" cy="255" r="2.5" fill="#c2912e"/>
      <text x="952" y="253" font-size="18" font-weight="800" fill="#25211d">Learning Paths</text>
      <text x="952" y="277" font-size="14" font-weight="600" fill="#655f57">curriculum, tutorials, projects</text>
    </g>
  </g>
</svg>
