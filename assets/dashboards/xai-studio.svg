    <text x="24" y="42" fill="#176b63" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Local Explanation</text>
    <line x1="154" y1="82" x2="154" y2="216" stroke="#1e2927" stroke-width="2" opacity="0.45"/>
