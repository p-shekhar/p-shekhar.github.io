<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">XAI Studio dashboard thumbnail</title>
  <desc id="desc">A stylized dashboard showing feature importance, local explanations, recourse, and reliability checks.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7f4ed"/>
      <stop offset="1" stop-color="#f1f3fb"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#176b63"/>
      <stop offset="1" stop-color="#5b6fb1"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#14322d" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="1200" height="650" rx="34" fill="url(#bg)"/>
  <rect x="52" y="54" width="1096" height="542" rx="28" fill="#ffffff" filter="url(#soft)" opacity="0.96"/>
  <text x="94" y="114" fill="#1e2927" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">XAI Studio</text>
  <text x="94" y="154" fill="#655f57" font-family="Arial, Helvetica, sans-serif" font-size="19">Model behavior, explanation scope, local attribution, recourse, and reliability checks</text>
  <g transform="translate(92 212)">
