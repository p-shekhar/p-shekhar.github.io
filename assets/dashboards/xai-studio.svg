      <rect x="0" y="42" width="162" height="18" rx="9" fill="#2f9185"/>
      <rect x="0" y="84" width="121" height="18" rx="9" fill="#c2912e"/>
      <rect x="0" y="126" width="82" height="18" rx="9" fill="#b75d45"/>
      <rect x="0" y="168" width="54" height="18" rx="9" fill="#5b6fb1"/>
    </g>
    <text x="37" y="268" fill="#655f57" font-family="Arial, Helvetica, sans-serif" font-size="15">Permutation importance and feature effects</text>
  </g>
  <g transform="translate(445 212)">
