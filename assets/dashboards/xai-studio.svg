  <g transform="translate(798 212)">
    <rect width="310" height="298" rx="18" fill="#f8fbfa" stroke="#d8e4df"/>
    <text x="24" y="42" fill="#176b63" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Reliability Audit</text>
