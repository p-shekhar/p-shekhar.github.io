<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Statistical Inference Studio dashboard thumbnail</title>
  <desc id="desc">A stylized dashboard showing sampling distributions, confidence intervals, and an inference workflow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f7f4ed"/>
      <stop offset="1" stop-color="#eef7f4"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" x2="1">
      <stop offset="0" stop-color="#176b63"/>
      <stop offset="1" stop-color="#2f9185"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#14322d" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="1200" height="650" rx="34" fill="url(#bg)"/>
  <rect x="52" y="54" width="1096" height="542" rx="28" fill="#ffffff" filter="url(#soft)" opacity="0.96"/>
  <text x="94" y="114" fill="#1e2927" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">Statistical Inference Studio</text>
  <text x="94" y="154" fill="#655f57" font-family="Arial, Helvetica, sans-serif" font-size="19">Simulation, sampling variability, uncertainty, and evidence-to-decision reasoning</text>
  <g transform="translate(92 210)">
    <rect width="310" height="300" rx="18" fill="#f8fbfa" stroke="#d8e4df"/>
    <text x="24" y="42" fill="#176b63" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Repeated Sampling</text>
    <path d="M38 224 C90 86, 162 84, 250 224" fill="none" stroke="#176b63" stroke-width="7" stroke-linecap="round"/>
    <path d="M62 224 C105 132, 170 125, 236 224" fill="none" stroke="#c2912e" stroke-width="5" stroke-linecap="round" opacity="0.82"/>
    <line x1="44" y1="224" x2="266" y2="224" stroke="#948b82" stroke-width="2"/>
    <circle cx="91" cy="200" r="6" fill="#b75d45"/>
    <circle cx="124" cy="164" r="6" fill="#b75d45"/>
    <circle cx="159" cy="142" r="6" fill="#b75d45"/>
    <circle cx="196" cy="165" r="6" fill="#b75d45"/>
    <circle cx="232" cy="207" r="6" fill="#b75d45"/>
    <text x="37" y="270" fill="#655f57" font-family="Arial, Helvetica, sans-serif" font-size="15">Estimator movement across samples</text>
  </g>
  <g transform="translate(445 210)">
    <rect width="310" height="300" rx="18" fill="#f8fbfa" stroke="#d8e4df"/>
    <text x="24" y="42" fill="#176b63" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Intervals & Evidence</text>
    <line x1="66" y1="85" x2="66" y2="242" stroke="#1e2927" stroke-width="3" opacity="0.65"/>
    <g stroke-width="6" stroke-linecap="round">
      <line x1="96" y1="104" x2="212" y2="104" stroke="#176b63"/>
      <line x1="78" y1="137" x2="186" y2="137" stroke="#176b63"/>
      <line x1="118" y1="170" x2="244" y2="170" stroke="#b75d45"/>
      <line x1="88" y1="203" x2="218" y2="203" stroke="#176b63"/>
      <line x1="104" y1="236" x2="230" y2="236" stroke="#176b63"/>
    </g>
    <text x="31" y="270" fill="#655f57" font-family="Arial, Helvetica, sans-serif" font-size="15">Coverage, tests, likelihood, and power</text>
  </g>
  <g transform="translate(798 210)">
    <rect width="310" height="300" rx="18" fill="#f8fbfa" stroke="#d8e4df"/>
    <text x="24" y="42" fill="#176b63" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Decision Workflow</text>
    <g fill="none" stroke="url(#teal)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M66 94 H238"/>
      <path d="M238 94 L218 82"/>
      <path d="M238 94 L218 106"/>
      <path d="M66 153 H238"/>
      <path d="M238 153 L218 141"/>
      <path d="M238 153 L218 165"/>
      <path d="M66 212 H238"/>
      <path d="M238 212 L218 200"/>
      <path d="M238 212 L218 224"/>
    </g>
    <g font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">
      <text x="44" y="99" fill="#1e2927">Target</text>
      <text x="116" y="99" fill="#1e2927">Sampling</text>
      <text x="202" y="99" fill="#1e2927">Evidence</text>
      <text x="44" y="158" fill="#1e2927">Intervals</text>
      <text x="126" y="158" fill="#1e2927">Tests</text>
      <text x="184" y="158" fill="#1e2927">Power</text>
      <text x="44" y="217" fill="#1e2927">Diagnostics</text>
      <text x="150" y="217" fill="#1e2927">Action</text>
    </g>
    <text x="31" y="270" fill="#655f57" font-family="Arial, Helvetica, sans-serif" font-size="15">From statistical concept to recommendation</text>
  </g>
</svg>
