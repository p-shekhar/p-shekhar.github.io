  type: website
  output-dir: _site
  resources:
    - "notebooks/projects/*/writeup/**"
    - "notebooks/tutorials/*/outputs/**"
  render:
    - "*.qmd"
    - "expertise/"
    - "projects/"
    - "notes/"
    - "tutorials/"
    - "writing/"
    - "posts/"
    - "notebooks/projects/*/*.ipynb"
    - "notebooks/tutorials/*/*.ipynb"
    - "notebooks/lectures/*/*.ipynb"
    - "notebooks/lectures/*/*/*.ipynb"
    - "!templates/"
