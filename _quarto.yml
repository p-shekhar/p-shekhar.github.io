format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-location: right
    number-sections: false
    code-copy: true
    code-overflow: wrap
    anchor-sections: true
    smooth-scroll: true
    include-in-header:
      text: |
        <meta name="theme-color" content="#f7f4ed">
    include-after-body:
      text: |
        <script>
        (() => {
          const setNotebookHref = (link) => {
            const offset = document.querySelector('meta[name="quarto:offset"]')?.content || "";
            const target = new URL(`${offset}${link.dataset.sitePath}`, window.location.href);
            link.href = target.href;
            link.dataset.originalHref = target.href;
          };

          const normalizeNotebookLinks = () => {
            document.querySelectorAll("a[data-site-path]").forEach(setNotebookHref);
          };

          normalizeNotebookLinks();
          window.addEventListener("pageshow", normalizeNotebookLinks);
          document.addEventListener("pointerdown", (event) => {
            const link = event.target.closest("a[data-site-path]");
            if (link) {
              setNotebookHref(link);
            }
          }, true);
        })();
        </script>

execute:
  enabled: false
  freeze: auto
  warning: false
  message: false
